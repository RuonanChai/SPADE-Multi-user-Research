<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Spark • Streaming LoD</title>
  <style>
    body {
      margin: 0;
      background-color: black;
    }
    canvas {
      display: block;
      touch-action: none;
    }
    .overlay {
      position: fixed;
      margin: 12px;
      bottom: 0;
      color: white;
    }
    .overlay > * {
      margin: 6px;
    }
  </style>
</head>

<body>
  <script type="importmap">
    {
      "imports": {
        "three": "../js/vendor/three/build/three.module.js",
        "lil-gui": "/examples/js/vendor/lil-gui/dist/lil-gui.esm.js",
        "@sparkjsdev/spark": "../../dist/spark.module.js"
      }
    }
  </script>
  <div class="overlay">
    <h2 id="title"></h2>
    <p id="subtitle"></p>
  </div>
  <canvas id="canvas" tabindex="0" style="outline: none;"></canvas>
  <script type="module">
    import * as THREE from "three";
    import { SparkRenderer, SplatMesh, SparkControls, isMobile } from "@sparkjsdev/spark";
    import GUI from "lil-gui";

    // UNIQUE_MARKER_2026_10_02_ICASSP_CLEAN
    const uParams = new URLSearchParams(location.search);

    /** On localhost, .rad Range via Vite is very slow on Windows; use MonitoredAssetServer (npm run dev:streaming-lod → 9210). */
    function localRadUrl(relativePath) {
      const rel = relativePath.replace(/^\//, "");
      const host = location.hostname;

      // P5_3DGS SAME-ORIGIN MODE: if p5_route=1, use relative /_p5rad/ path
      const p5Route = uParams.get("p5_route");
      if (p5Route === "1") {
        const userId = uParams.get("user_id") || "";
        const runId = uParams.get("run_id") || "";
        const params = new URLSearchParams();
        if (userId) params.set("user_id", userId);
        if (runId) params.set("run_id", runId);

        return `/_p5rad/${rel}${params.toString() ? '?' + params.toString() : ''}`;
      }

      // DIRECT COS MODE: if rad_port is "cos", return direct COS URL
      const port = uParams.get("rad_port");
      if (port === "cos") {
        return `https://streaming-1438331348.cos.ap-guangzhou.myqcloud.com/${rel}`;
      }

      if (host !== "localhost" && host !== "127.0.0.1") return relativePath.split("/").pop() || relativePath;

      const userId = uParams.get("user_id") || "";
      const runId = uParams.get("run_id") || "";

      let url = `http://${host}:${port || "9210"}/${rel}`;

      // Attach user_id and run_id to .rad URL query
      const params = new URLSearchParams();
      if (userId) params.set("user_id", userId);
      if (runId) params.set("run_id", runId);

      if (params.toString()) {
        url += `?${params.toString()}`;
      }

      return url;
    }
    const replayMode = uParams.get("mode") === "replay" && (window.__sparkInlineReplayTrace != null || (uParams.get("trace_url") || "").length > 0);
    const traceUrl = uParams.get("trace_url") || "";
    const startOffsetMs = Number.parseInt(uParams.get("start_offset_ms") || "0", 10) || 0;
    const scenarioId = uParams.get("scenario_id") || "";
    const userId = uParams.get("user_id") || "";
    const workload = uParams.get("workload") || "";

    /** 与 src/trace/TracePlayer 等价的最小实现，供 distributed replay 驱动相机（触发 LoD Range 请求）。 */
    class MiniTracePlayer {
      constructor(camera, trace, options) {
        this.camera = camera;
        this.trace = trace;
        this.deterministic = options?.deterministic ?? true;
        this.t0 = 0;
        this.idx = 0;
        this.done = false;
      }
      start(startOffsetMs0 = 0) {
        const off = Number.isFinite(window.__sparkInlineReplayStartOffset)
          ? Number(window.__sparkInlineReplayStartOffset)
          : startOffsetMs0;
        this.t0 = performance.now() - off;
        this.idx = 0;
        this.done = false;
      }
      // Normalize the frozen trace format to a uniform sample array:
      //   frame {time (sec), camera:{x,y,z}, [quaternion], [fov]}  ->  {t_ms, position:[x,y,z], quaternion?, fov?}
      // Already-normalized traces (samples with t_ms/position) pass through unchanged.
      static normalize(trace) {
        const raw = trace?.samples || trace?.frames || [];
        const out = [];
        for (const f of raw) {
          let t_ms = (typeof f.t_ms === "number") ? f.t_ms
                   : (typeof f.time === "number") ? f.time * 1000 : null;
          if (t_ms === null) continue;
          let position = null;
          if (Array.isArray(f.position) && f.position.length === 3) position = f.position;
          else if (f.camera && typeof f.camera.x === "number") position = [f.camera.x, f.camera.y, f.camera.z];
          const sample = { t_ms, position };
          if (Array.isArray(f.quaternion) && f.quaternion.length === 4) sample.quaternion = f.quaternion;
          if (typeof f.fov === "number") sample.fov = f.fov;
          out.push(sample);
        }
        return out;
      }
      get samples() {
        if (!this._samples) this._samples = MiniTracePlayer.normalize(this.trace);
        return this._samples;
      }
      update() {
        const samples = this.samples;
        if (this.done || samples.length === 0) return;
        const elapsed = performance.now() - this.t0;

        // [TRACE_TICK] 每秒最多打印一次
        if (!this._lastDebugLog || Date.now() - this._lastDebugLog > 1000) {
          console.log('[TRACE_TICK]', {idx: this.idx, elapsed: elapsed.toFixed(0), done: this.done, samples: samples.length});
          this._lastDebugLog = Date.now();
        }

        while (this.idx < samples.length - 1 && samples[this.idx + 1].t_ms <= elapsed) {
          this.idx += 1;
        }
        const sample = this.pickFrame(elapsed, samples);
        this.applySample(sample);
        if (this.idx >= samples.length - 1 && elapsed >= samples[samples.length - 1].t_ms) {
          this.done = true;
        }
      }
      pickFrame(elapsedMs, samples) {
        const current = samples[this.idx];
        const next = samples[Math.min(this.idx + 1, samples.length - 1)];
        if (this.deterministic || current === next || next.t_ms === current.t_ms) return current;
        const alpha = Math.max(0, Math.min(1, (elapsedMs - current.t_ms) / (next.t_ms - current.t_ms)));
        const out = { t_ms: elapsedMs, fov: current.fov ?? next.fov };
        if (current.position && next.position) {
          out.position = [
            THREE.MathUtils.lerp(current.position[0], next.position[0], alpha),
            THREE.MathUtils.lerp(current.position[1], next.position[1], alpha),
            THREE.MathUtils.lerp(current.position[2], next.position[2], alpha),
          ];
        } else {
          out.position = current.position;
        }
        if (current.quaternion && next.quaternion) {
          const cQ = new THREE.Quaternion(...current.quaternion);
          const nQ = new THREE.Quaternion(...next.quaternion);
          cQ.slerp(nQ, alpha);
          out.quaternion = [cQ.x, cQ.y, cQ.z, cQ.w];
        } else {
          out.quaternion = current.quaternion;
        }
        return out;
      }
      applySample(sample) {
        if (sample.position && sample.position.length === 3) {
          this.camera.position.set(sample.position[0], sample.position[1], sample.position[2]);
        }
        if (sample.quaternion && sample.quaternion.length === 4) {
          this.camera.quaternion.set(
            sample.quaternion[0],
            sample.quaternion[1],
            sample.quaternion[2],
            sample.quaternion[3],
          );
        }
        if (typeof sample.fov === "number") {
          this.camera.fov = sample.fov;
          this.camera.updateProjectionMatrix();
        }
      }
    }

    const worlds = {
      "Hobbiton": {
        url: localRadUrl("tijerin_w6_hobbiton-lod.rad"),
        quaternion: [1, 0, 0, 0],
        background: "#cafefe",
        description: "24M splats created by Tijerin with World Labs Marble",
      },
      "Cozy Spaceship": {
        url: localRadUrl("cozy-spaceship_2-lod.rad"),
        position: [0, -6.5, 0],
        background: "#000000",
        description: "6M splats created by Britt Casado with World Labs Marble",
      },
      "Coit Tower, SF": {
        url: localRadUrl("coit-40m-sh1-lod.rad"),
        quaternion: [1, 0, 0, 0],
        scale: 10.0,
        cameraPosition: [-0.858, 2.203, -1.128],
        cameraQuaternion: [-0.043, -0.909, -0.097, 0.402],
        background: "#cafefe",
        lodSplatScale: 1.5,
        highDpi: !isMobile(),
        description: "40M splats scanned by Vincent Woo",
      },
      "Jastrzębia Góra, Poland": {
        url: localRadUrl("poland-lod.rad"),
        quaternion: [1, 0, 0, 0],
        scale: 0.05,
        cameraPosition: [43.7, -3.5, -1.7],
        cameraQuaternion: [-0.230, 0.241, 0.006, 0.943],
        background: "#cafefe",
        highDpi: !isMobile(),
        description: "100M splats scanned by Andrii Shramko",
      },
    };

    const title = document.getElementById("title");
    const subtitle = document.getElementById("subtitle");

    const scene = new THREE.Scene();
    scene.background = new THREE.Color("#000000");
    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.01, 1000);
    const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById("canvas") });
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }
    window.addEventListener('resize', onWindowResize, false);

    function snapshotFrameState() {
      const params = new URLSearchParams(location.search);
      window.__p5FrameState = {
        ts_ms: performance.now(),
        client_id: params.get("user_id"),
        run_id: params.get("run_id"),
        camera: {
          position: camera.position.toArray(),
          quaternion: camera.quaternion.toArray(),
          fov: camera.fov,
          viewport: [window.innerWidth, window.innerHeight],
        },
        cone: { coneFov0: 70, coneFov: 120, behindFoveate: 0.2, coneFoveate: 0.4 },
      };
    }
    snapshotFrameState();

    // CoNEXT DLS: K from URL spark_sdl_k (SPADE=4). Spark-OD leaves unset/0.
    const sparkSdlK = Number.parseInt(uParams.get("spark_sdl_k") || "0", 10) || 0;
    if (sparkSdlK > 0) {
      window.__sparkSdlK = sparkSdlK;
      window.__sdlStats = window.__sdlStats || {
        lookahead_enqueued: 0,
        lookahead_confirmed: 0,
        lookahead_wasted: 0,
        lookahead_gated_off: 0,
        original_demanded: 0,
        drive_calls: 0,
      };
    }
    const spark = new SparkRenderer({
      renderer,
      pagedExtSplats: true,
      enableLod: true,
      enableDriveLod: true,
      enableLodFetching: true,
      coneFov0: 70.0,
      coneFov: 120.0,
      behindFoveate: 0.2,
      coneFoveate: 0.4,
    });
    scene.add(spark);

    const worldKeyParam = uParams.get("world");
    const defaultWorldKey = worldKeyParam && worlds[worldKeyParam] ? worldKeyParam : "Coit Tower, SF";
    const settings = {
      worldKey: defaultWorldKey,
    };
    let world = null;

    function selectWorld(worldKey) {
      if (world) {
        scene.remove(world);
        world.dispose();
      }

      const { url, quaternion, position, scale, background, description, cameraPosition, cameraQuaternion, lodSplatScale, highDpi } = worlds[worldKey];
      world = new SplatMesh({ url, paged: true });
      world.quaternion.set(...quaternion ?? [0, 0, 0, 1]).normalize();
      world.position.set(...(position ?? [0, 0, 0]));
      world.scale.setScalar(scale ?? 1.0);
      scene.add(world);
      scene.background = new THREE.Color(background);

      // Expose world + spark renderer for QoE instrumentation (command217 §1E).
      window.__world = world;
      window.__scene = scene;
      window.__spark = spark;

      // QoE visible-splat polling.
      // Authoritative "current visible splat count" = SparkRenderer.activeSplats,
      // the per-frame instanceCount actually drawn after LoD/frustum culling
      // (spark-golden/src/SparkRenderer.ts:752  `geometry.instanceCount = spark.activeSplats`).
      // This is the true render-state value with the semantic meaning command41/command217
      // define for FV/Q5/Q10/T1M/blank_ratio; it is the readout source only and does NOT
      // redefine those metrics (they are computed downstream from the sampled timeline).
      // world.pager.visibleSplats (the legacy source) is intentionally NOT used — that object
      // field does not resolve and produced all-zero timelines. totalSplats (streamed/loaded
      // count) is exposed separately for diagnostics only.
      if (!window.__splatPoller) {
        window.__splatPoller = setInterval(() => {
          let visible = 0;
          let total = 0;
          try {
            if (spark && typeof spark.activeSplats === 'number') visible = spark.activeSplats;
            const w = world;
            if (w) {
              if (w.paged && typeof w.paged.numSplats === 'number') total = w.paged.numSplats;
              else if (w.paged && w.paged.pager && typeof w.paged.pager.numSplats === 'number') total = w.paged.pager.numSplats;
              else if (typeof w.numSplats === 'number') total = w.numSplats;
              else if (w.numSplats && typeof w.numSplats.value === 'number') total = w.numSplats.value;
            }
          } catch (e) {}
          window.__visibleSplats = visible || 0;
          window.__totalSplats = total || 0;
        }, 100);
      }
      console.log('[INSTRUMENT] world+spark exposed, QoE polling (spark.activeSplats) started');

      camera.position.set(...(cameraPosition ?? [0, 0, 0]));
      camera.quaternion.set(...(cameraQuaternion ?? [0, 0, 0, 1])).normalize();
      title.textContent = worldKey;
      subtitle.textContent = description;
      spark.lodSplatScale = lodSplatScale ?? 1.0;
      renderer.setPixelRatio(highDpi ? window.devicePixelRatio : 1);
      onWindowResize();
      console.log("Render size", renderer.domElement.width, renderer.domElement.height);
      renderer.domElement.focus();
    }

    selectWorld(settings.worldKey);

    let tracePlayer = null;
    let replayStartWallclock = null;
    if (replayMode) {
      let trace = window.__sparkInlineReplayTrace;
      if (!trace && traceUrl) {
        const tr = await fetch(traceUrl, { cache: "no-store" });
        trace = await tr.json();
      }
      const traceFrames = trace?.frames || trace?.samples;
        if (trace && traceFrames && traceFrames.length) {
        tracePlayer = new MiniTracePlayer(camera, trace, { deterministic: true });
        tracePlayer.start(startOffsetMs);
        replayStartWallclock = Date.now();
      }
    }

    let controls = null;
    if (!tracePlayer) {
      const gui = new GUI({ title: "Settings" });
      gui.add(settings, "worldKey", Object.keys(worlds)).name("World").onChange(selectWorld);
      gui.add(spark, "lodSplatScale", 0.01, 2.5, 0.001).name("Level of Detail").listen();
      controls = new SparkControls({ canvas: renderer.domElement });
    }

    window.__slDiagCam = camera;
    window.__clientTrace = {
      mode: tracePlayer ? "replay" : "idle",
      replay_start_wallclock: replayStartWallclock,
      user_id: userId,
      trace_id: uParams.get("trace_id") || "",
      scenario_id: scenarioId,
      workload,
      experiment_context: { workload, scenario_id: scenarioId, user_id: userId },
      get_fetch_logs: () => [],
    };

    // P5 Test Bridge for trace replay (enabled via p5_test=1)
    if (uParams.get("p5_test") === "1") {
      window.__P5TraceBridge = {
        version: "1.0.0",
        ready: false,
        traceError: null,

        get framesReplayed() {
          return tracePlayer?.idx || 0;
        },

        get cameraChanged() {
          return (tracePlayer?.idx || 0) > 0;
        },

        loadTrace(traceData) {
          try {
            const traceFrames = traceData.frames ?? traceData.samples;
            if (!traceFrames?.length) {
              this.traceError = "Invalid trace data";
              return false;
            }
            tracePlayer = new MiniTracePlayer(camera, traceData, { deterministic: true });
            return true;
          } catch (e) {
            this.traceError = e.message;
            return false;
          }
        },

        startReplay() {
          if (!tracePlayer) {
            this.traceError = "No trace loaded";
            return false;
          }
          tracePlayer.start(0);
          replayStartWallclock = Date.now();
          return true;
        },

        getState() {
          return {
            framesReplayed: this.framesReplayed,
            cameraChanged: this.cameraChanged,
            traceError: this.traceError
          };
        },

        getDiagnosticSnapshot() {
          return {
            framesReplayed: this.framesReplayed,
            cameraChanged: this.cameraChanged,
            traceError: this.traceError,
            tracePlayerExists: !!tracePlayer,
            tracePlayerIdx: tracePlayer?.idx || 0,
            tracePlayerDone: tracePlayer?.done || false,
            traceSampleCount: tracePlayer?.samples?.length || 0,
            replayStartWallclock: replayStartWallclock
          };
        }
      };

      // READY semantics (command41 Section I / command217 §1D): browser + bridge + viewer
      // object + camera are instantiated. The legacy `world.pager` guard references a field
      // that does not exist on the current SplatMesh (it exposes `world.paged`), so it never
      // resolved and caused VISUAL_READY timeouts. Guarding on `world && camera` restores the
      // intended READY semantics without redefining them; splat streaming progress is observed
      // separately via spark.activeSplats, not as a READY precondition.
      const waitForReady = setInterval(() => {
        if (world && camera) {
          window.__P5TraceBridge.ready = true;
          clearInterval(waitForReady);
        }
      }, 100);
    }

    // NP2A: trajectory pose-lookahead — drive LOD at pose(t+H) then restore.
    // Enabled only when spade_traj_lookahead_ms>0 (SPADE canary). Not blind prefetch.
    const spadeLookaheadMs = Number.parseInt(uParams.get("spade_traj_lookahead_ms") || "0", 10) || 0;
    // Bind p5_la at fetch boundary (dist spark.module.js may lag source). Demand-first proxy needs the tag.
    if (spadeLookaheadMs > 0 && !window.__P5_NP2A_FETCH_WRAP) {
      window.__P5_NP2A_FETCH_WRAP = true;
      const _origFetch = window.fetch.bind(window);
      window.fetch = function (input, init) {
        if (window.__P5_NP2A_LA) {
          try {
            const rawUrl = typeof input === "string" ? input : (input && input.url);
            if (rawUrl && (rawUrl.includes("_p5rad") || rawUrl.includes(".rad"))) {
              const u = new URL(rawUrl, location.origin);
              if (!u.searchParams.has("p5_la")) {
                u.searchParams.set("p5_la", "1");
                const abs = u.toString();
                if (typeof input === "string") {
                  input = /^https?:\/\//i.test(rawUrl) ? abs : (u.pathname + u.search + u.hash);
                } else if (typeof Request !== "undefined" && input instanceof Request) {
                  const headers = new Headers(input.headers);
                  input = new Request(abs, {
                    method: input.method,
                    headers,
                    credentials: input.credentials,
                    cache: input.cache,
                    mode: input.mode,
                    redirect: input.redirect,
                    referrer: input.referrer,
                  });
                }
              }
            }
          } catch (e) {
            try { console.warn("[NP2A] p5_la fetch wrap failed", e); } catch (_) {}
          }
        }
        return _origFetch(input, init);
      };
    }
    const _laPos = new THREE.Vector3();
    const _laQuat = new THREE.Quaternion();
    let _laFov = 75;
    renderer.setAnimationLoop(function animate(time) {
      if (tracePlayer) {
        tracePlayer.update();
        if (spadeLookaheadMs > 0 && !tracePlayer.done) {
          const samples = tracePlayer.samples;
          if (samples && samples.length) {
            const elapsed = performance.now() - tracePlayer.t0;
            const future = Math.min(
              elapsed + spadeLookaheadMs,
              samples[samples.length - 1].t_ms
            );
            _laPos.copy(camera.position);
            _laQuat.copy(camera.quaternion);
            _laFov = camera.fov;
            const futSample = tracePlayer.pickFrame(future, samples);
            tracePlayer.applySample(futSample);
            // One render drives Spark LOD/fetch for future pose; then restore for display.
            // Keep __P5_NP2A_LA set until demand render so async fetch starts still tag p5_la.
            window.__P5_NP2A_LA = true;
            snapshotFrameState();
            renderer.render(scene, camera);
            camera.position.copy(_laPos);
            camera.quaternion.copy(_laQuat);
            if (camera.fov !== _laFov) {
              camera.fov = _laFov;
              camera.updateProjectionMatrix();
            }
            window.__P5_NP2A_LA = false;
          }
        }
      } else if (controls) controls.update(camera);
      snapshotFrameState();
      renderer.render(scene, camera);
    });
  </script>
</body>

</html>
