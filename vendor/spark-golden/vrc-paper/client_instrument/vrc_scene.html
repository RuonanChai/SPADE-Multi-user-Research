<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VRC • Spark Streaming LoD</title>
  <style>
    body { margin: 0; background-color: black; }
    canvas { display: block; touch-action: none; }
    .overlay { position: fixed; margin: 12px; bottom: 0; color: white; }
    .overlay > * { margin: 6px; }
    #vrc-panel {
      position: fixed; top: 10px; right: 10px; background: rgba(0,0,0,0.75);
      color: #0f0; font-family: monospace; font-size: 11px; padding: 8px;
      border-radius: 4px; min-width: 220px; z-index: 9999; pointer-events: none;
    }
    #vrc-panel .row { display: flex; justify-content: space-between; }
    #vrc-panel .label { color: #aaa; }
    /* Avatar overlays */
    .vrc-avatar {
      position: fixed; width: 12px; height: 12px; border-radius: 50%;
      border: 2px solid white; pointer-events: none; z-index: 9998;
    }
  </style>
</head>
<body>
  <!-- VRC metric panel -->
  <div id="vrc-panel">
    <div style="color:#ff0;font-weight:bold" id="vrc-method-label">VRC</div>
    <div class="row"><span class="label">P95 lat</span><span id="m-p95">—</span></div>
    <div class="row"><span class="label">Frac&gt;50ms</span><span id="m-frac">—</span></div>
    <div class="row"><span class="label">Dup ratio</span><span id="m-dup">—</span></div>
    <div class="row"><span class="label">FPS</span><span id="m-fps">—</span></div>
    <div class="row"><span class="label">QoE</span><span id="m-qoe">—</span></div>
    <div class="row"><span class="label">Inflight</span><span id="m-inf">—</span></div>
    <div class="row"><span class="label">Chunks</span><span id="m-chunks">—</span></div>
    <div class="row"><span class="label">Peers</span><span id="m-peers">—</span></div>
  </div>

  <div class="overlay">
    <h2 id="title"></h2>
    <p id="subtitle"></p>
  </div>
  <canvas id="canvas" tabindex="0" style="outline: none;"></canvas>

  <!-- Step 1: inject VRC globals BEFORE anything else -->
  <script>
    (function() {
      const p = new URLSearchParams(location.search);
      window.__vrcUserId    = p.get("user_id")    ?? "u0";
      window.__vrcMethod    = p.get("method")     ?? "Spark-MU";
      window.__vrcSessionId = p.get("session_id") ?? ("session_" + Date.now());
      window.__vrcScenarioId= p.get("scenario_id")?? "nearby";
      window.__vrcSyncPort  = Number(p.get("sync_port") ?? 9201);
      // Worker2 browsers must use controller LAN IP for WebSocket/metrics HTTP (not localhost).
      window.__vrcSyncHost  = (p.get("sync_host") ?? "localhost").trim() || "localhost";
      window.__vrcTotalChunks = 50; // updated when manifest loads
      window.__vrcDecision  = null;
      window.__vrcPeers     = [];
      window.__vrcSyncDelay = 0;
      const p2 = new URLSearchParams(location.search);
      const _ti = parseInt(p2.get("trial_index") ?? "", 10);
      window.__vrcTrialIndex = Number.isFinite(_ti) ? _ti : null;
      window.__vrcDeliveryProfile = (p2.get("vrc_delivery_profile") ?? "").trim();
      window.__vrcHpcBase = (p2.get("vrc_hpc_base") ?? "").trim().replace(/\/+$/, "");
      window.__vrcCdnBase = (p2.get("vrc_cdn_base") ?? "").trim().replace(/\/+$/, "");
      window.__vrcCdn2Base = (p2.get("vrc_cdn2_base") ?? "").trim().replace(/\/+$/, "");
      window.__vrcCdn2ObjectPath = (p2.get("vrc_cdn2_object_path") ?? "").trim().replace(/^\/+/, "");
      window.__vrcCdn2ObjectPathHobbiton = (p2.get("vrc_cdn2_object_path_hobbiton") ?? "").trim().replace(/^\/+/, "");
      window.__vrcCdnLabel = (p2.get("vrc_cdn_label") ?? "").trim().toLowerCase();
      window.__vrcHotThreshold = Number(p2.get("vrc_hot_threshold") ?? 2) || 2;
      window.__vrcCdnFallback = (p2.get("vrc_cdn_fallback") ?? "true") !== "false";
      window.__vrcRadBaseStr = "";
      window.__vrcSourceEvents = [];
      window.__vrcLatestDecision = null;
    })();
  </script>

  <!-- ResourceTiming audit (Phase 2) — before fetches -->
  <script src="/vrc-paper/client_instrument/resource_timing_probe.js"></script>
  <!-- Step 2: VRC config (must precede scheduler) -->
  <script src="/vrc-paper/client_instrument/vrc_config.js"></script>

  <!-- Step 2b: Install __sparkExpEvent stub BEFORE Spark so all chunk events are captured.
       The full metric_collector.js will attach to this buffer after Spark loads. -->
  <script>
    (function() {
      window.__sparkExpEventQueue = [];
      window.__sparkExpEvent = function(evt) {
        // Buffer events until metric_collector.js installs the real handler
        window.__sparkExpEventQueue.push({ ...evt, _t: performance.now() });
        // Also do fetch-level timing if we see it via scheduler (self-timing fallback)
      };
    })();
  </script>

  <!-- Step 3: VRC scheduler (patches fetch BEFORE Spark module loads) -->
  <script src="/vrc-paper/client_instrument/vrc_scheduler.js"></script>

  <!-- Step 4: Spark scene via importmap (points at original unmodified dist) -->
  <!-- Uses spark.module.min.js (production build always present). -->
  <!-- If dev build runs first and creates spark.module.js, that will be used by Vite alias. -->
  <script type="importmap">
    {
      "imports": {
        "three": "../js/vendor/three/build/three.module.js",
        "lil-gui": "/examples/js/vendor/lil-gui/dist/lil-gui.esm.js",
        "@sparkjsdev/spark": "../../dist/spark.module.min.js"
      }
    }
  </script>

  <!-- Step 5: Original Spark scene (unchanged) loaded via module -->
  <script type="module">
    import * as THREE from "three";
    import { SparkRenderer, SplatMesh, SparkControls, isMobile } from "@sparkjsdev/spark";

    const uParams = new URLSearchParams(location.search);
    const worldKey = uParams.get("world") ?? "Coit Tower, SF";
    const viteEnv = (typeof import.meta !== "undefined" && import.meta.env) ? import.meta.env : {};
    // Default pipeline: Cloudflare R2 public URL + flat keys (matches uploaded spark-assets objects).
    // Opt out: ?use_gcs_rad=1 or set VITE_VRC_RAD_ASSET_BASE / pass rad_asset_base to override.
    const VRC_R2_PUB_BASE = "https://pub-0429777a95db48e192b4c665413f8eb2.r2.dev";
    const useGcsRad = uParams.get("use_gcs_rad") === "1";
    const radBase = useGcsRad
      ? ""
      : (uParams.get("rad_asset_base") || viteEnv.VITE_VRC_RAD_ASSET_BASE || VRC_R2_PUB_BASE).trim().replace(/\/+$/, "");
    if (typeof window !== "undefined") {
      window.__vrcRadBaseStr = radBase;
    }
    const keyCoit = (uParams.get("rad_key_coit") || viteEnv.VITE_VRC_RAD_KEY_COIT || "streaming-lod/coit-40m-sh1-lod.rad").trim().replace(/^\/+/, "");
    const keyHobbiton = (uParams.get("rad_key_hobbiton") || viteEnv.VITE_VRC_RAD_KEY_HOBBITON || "streaming-lod/tijerin_w6_hobbiton-lod.rad").trim().replace(/^\/+/, "");
    const gcsCoit = "https://storage.googleapis.com/forge-dev-public/asundqui/rad/260217/coit-40m-sh1-lod.rad";
    const gcsHobbiton = "https://storage.googleapis.com/forge-dev-public/asundqui/rad/260219/tijerin_w6_hobbiton-lod.rad";
    const coitRad = radBase ? `${radBase}/${keyCoit}` : gcsCoit;
    const hobbitonRad = radBase ? `${radBase}/${keyHobbiton}` : gcsHobbiton;

    const worlds = {
      "Coit Tower, SF": {
        url: coitRad,
        quaternion: [1,0,0,0], scale: 10.0,
        cameraPosition: [-0.858, 2.203, -1.128],
        cameraQuaternion: [-0.043, -0.909, -0.097, 0.402],
        background: "#cafefe", lodSplatScale: 1.5, highDpi: !isMobile(),
        description: "40M splats scanned by Vincent Woo",
      },
      "Hobbiton": {
        url: hobbitonRad,
        quaternion: [1,0,0,0], background: "#cafefe",
        description: "24M splats created by Tijerin with World Labs Marble",
      },
    };

    const w = worlds[worldKey] ?? worlds["Coit Tower, SF"];
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(w.background ?? "#000");
    const camera = new THREE.PerspectiveCamera(75, innerWidth/innerHeight, 0.01, 1000);
    const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById("canvas") });
    renderer.setSize(innerWidth, innerHeight);

    window.addEventListener("resize", () => {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
    });

    const spark = new SparkRenderer({
      renderer, pagedExtSplats: true,
      coneFov0: 70, coneFov: 120, behindFoveate: 0.2, coneFoveate: 0.4,
    });
    scene.add(spark);

    const world = new SplatMesh({ url: w.url, paged: true });
    world.quaternion.set(...(w.quaternion ?? [0,0,0,1])).normalize();
    world.position.set(...(w.position ?? [0,0,0]));
    world.scale.setScalar(w.scale ?? 1);
    scene.add(world);
    spark.lodSplatScale = w.lodSplatScale ?? 1;
    renderer.setPixelRatio(w.highDpi ? devicePixelRatio : 1);

    camera.position.set(...(w.cameraPosition ?? [0,0,0]));
    camera.quaternion.set(...(w.cameraQuaternion ?? [0,0,0,1])).normalize();

    document.getElementById("title").textContent = worldKey;
    document.getElementById("subtitle").textContent = w.description;

    // Expose camera for metric collector and trace player
    window.__slDiagCam = camera;

    // Scenario-specific initial camera offsets (for 4-user scenarios)
    const userId = window.__vrcUserId;
    const scenarioId = window.__vrcScenarioId;
    const userIdx = Number(userId.replace(/\D/g,"")) || 0;

    if (scenarioId === "nearby") {
      camera.position.x += (userIdx - 1.5) * 0.3;
      camera.position.y += (userIdx % 2) * 0.1;
    } else if (scenarioId === "burst_turn") {
      // all start spread, then turn — handled by trace
    } else if (scenarioId === "divergent") {
      const angles = [0, Math.PI/2, Math.PI, 3*Math.PI/2];
      const a = angles[userIdx % 4];
      camera.position.x += Math.cos(a) * 2;
      camera.position.z += Math.sin(a) * 2;
    }

    const controls = new SparkControls({ canvas: renderer.domElement });
    renderer.domElement.focus();

    // Trace replay support
    const traceUrl = uParams.get("trace_url");
    let tracePlayer = null;
    if (traceUrl) {
      const tr = await fetch(traceUrl, { cache: "no-store" });
      const trace = await tr.json();
      if (trace?.samples?.length) {
        tracePlayer = {
          samples: trace.samples, idx: 0,
          t0: performance.now() - Number(uParams.get("start_offset_ms") || 0),
          done: false,
          update() {
            if (this.done || !this.samples.length) return;
            const elapsed = performance.now() - this.t0;
            while (this.idx < this.samples.length - 1 && this.samples[this.idx+1].t_ms <= elapsed) this.idx++;
            const s = this.samples[this.idx];
            camera.position.set(...s.position);
            camera.quaternion.set(...s.quaternion);
            if (s.fov) { camera.fov = s.fov; camera.updateProjectionMatrix(); }
            if (this.idx >= this.samples.length-1 && elapsed >= this.samples.at(-1).t_ms) this.done = true;
          }
        };
        tracePlayer.update();
      }
    }

    renderer.setAnimationLoop(function animate(time) {
      if (tracePlayer) tracePlayer.update();
      else controls.update(camera);
      renderer.render(scene, camera);
    });
  </script>

  <!-- Step 6: metric collector (after Spark module, hooks into window.__sparkExpEvent) -->
  <script src="/vrc-paper/client_instrument/metric_collector.js"></script>

  <!-- Step 7: Avatar / peer overlay renderer -->
  <script src="/vrc-paper/client_instrument/avatar_overlay.js"></script>

  <!-- Step 8: Panel updater -->
  <script>
    (function updatePanel() {
      const method = window.__vrcMethod ?? "?";
      document.getElementById("vrc-method-label").textContent = method + " | user=" + (window.__vrcUserId ?? "?");
      setInterval(() => {
        const m = window.__vrcGetMetrics ? window.__vrcGetMetrics() : {};
        const raw = window.__vrcRawMetrics;
        document.getElementById("m-p95").textContent  = (m.p95_latency_ms??0).toFixed(1)+" ms";
        document.getElementById("m-frac").textContent = ((m.fraction_over_50ms??0)*100).toFixed(1)+"%";
        document.getElementById("m-dup").textContent  = ((m.duplicate_request_ratio??0)*100).toFixed(1)+"%";
        document.getElementById("m-fps").textContent  = (m.fps??0).toFixed(1);
        document.getElementById("m-qoe").textContent  = (m.qoe??0).toFixed(3);
        document.getElementById("m-inf").textContent  = ((m.request_inflight_bytes??0)/1024).toFixed(0)+" KB";
        document.getElementById("m-chunks").textContent = raw?.seen_chunks?.size ?? 0;
        document.getElementById("m-peers").textContent = (window.__vrcPeers??[]).length;
      }, 500);
    })();
  </script>
</body>
</html>
