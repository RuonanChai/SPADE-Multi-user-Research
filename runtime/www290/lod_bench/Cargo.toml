[package]
name = "lod_bench"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["rlib", "cdylib"]

[[bin]]
name = "lod_bench"
path = "src/main.rs"

[[bin]]
name = "export_tree"
path = "src/bin/export_tree.rs"

[[bin]]
name = "oracle_quickcheck"
path = "src/bin/oracle_quickcheck.rs"

[[bin]]
name = "h1_frontier_reuse"
path = "src/bin/h1_frontier_reuse.rs"

[[bin]]
name = "real_trace_oracle"
path = "src/bin/real_trace_oracle.rs"

[[bin]]
name = "h1_correctness_test"
path = "src/bin/h1_correctness_test.rs"

[dependencies]
half = "2"
ordered-float = "4"
wasm-bindgen = "0.2"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
